name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}
  PROJECT: wdc-cerebra

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r requirements.txt
      - run: pytest -v --tb=short

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api

  deploy:
    name: ECR push and ECS rolling deploy
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require OIDC role
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "AWS_ROLE_ARN secret is missing. Apply Terraform and set the github_actions_role_arn output as this secret."
            exit 1
          fi

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          FRONT="$REGISTRY/wdc-cerebra-frontend"
          BACK="$REGISTRY/wdc-cerebra-backend"

          docker build -t "$BACK:$SHA" -t "$BACK:latest" ./backend
          docker build -t "$FRONT:$SHA" -t "$FRONT:latest" \
            --build-arg VITE_API_BASE_URL=/api ./frontend

          docker push "$BACK:$SHA"
          docker push "$BACK:latest"
          docker push "$FRONT:$SHA"
          docker push "$FRONT:latest"

      - name: Deploy ECS services (SHA tags)
        env:
          SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/ecs_deploy.sh scripts/smoke_test.sh
          CLUSTER="${PROJECT}-${ENVIRONMENT}-cluster"
          FAMILY_PREFIX="${PROJECT}-${ENVIRONMENT}"
          scripts/ecs_deploy.sh \
            "$CLUSTER" \
            "${FAMILY_PREFIX}-frontend" \
            wdc-cerebra-frontend \
            "$SHA"
          scripts/ecs_deploy.sh \
            "$CLUSTER" \
            "${FAMILY_PREFIX}-backend" \
            wdc-cerebra-backend \
            "$SHA"

      - name: Wait for services stable
        run: |
          CLUSTER="${PROJECT}-${ENVIRONMENT}-cluster"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services wdc-cerebra-frontend wdc-cerebra-backend

      - name: Verify target groups healthy
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT}-${ENVIRONMENT}-cluster"
          for SERVICE in wdc-cerebra-frontend wdc-cerebra-backend; do
            RUNNING=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].runningCount' --output text)
            DESIRED=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].desiredCount' --output text)
            echo "$SERVICE running=$RUNNING desired=$DESIRED"
            if [ "$RUNNING" != "$DESIRED" ] || [ "$RUNNING" = "0" ]; then
              echo "Service $SERVICE is not at desired count"
              exit 1
            fi
          done

          TG_ARNS=$(aws elbv2 describe-target-groups --query "TargetGroups[?contains(TargetGroupName, 'wdc-cerebra')].TargetGroupArn" --output text)
          for ARN in $TG_ARNS; do
            HEALTH=$(aws elbv2 describe-target-health --target-group-arn "$ARN" \
              --query 'TargetHealthDescriptions[*].TargetHealth.State' --output text)
            echo "TG $ARN health=$HEALTH"
            echo "$HEALTH" | grep -q healthy
          done

      - name: Smoke test ALB
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "${PROJECT}-${ENVIRONMENT}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text)
          export APP_URL="http://${ALB_DNS}"
          echo "APP_URL=$APP_URL"
          scripts/smoke_test.sh "$APP_URL"
